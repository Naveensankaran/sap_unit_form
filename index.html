<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Project Details</title>
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<style>
:root{--ink:#1f2933;--muted:#6b7785;--line:#d9dee4;--bg:#f5f7f9;--brand:#1a5f7a;--brand-dark:#134a5f;--danger:#e03a3a;--ok:#1e8e5a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;font-size:14px;color:var(--ink);background:#fff}
.shell{display:flex;flex-direction:column;height:100%}.body{flex:1;overflow-y:auto;padding:16px 20px}
fieldset{border:0;padding:0;margin:0 0 22px}legend{padding:0 0 8px;margin-bottom:12px;width:100%;font-weight:600;color:var(--brand);border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}.field label{display:block;margin-bottom:4px;font-size:12px;color:var(--muted)}
.req{color:var(--danger);margin-left:2px;font-weight:700}
input,select{width:100%;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:4px;font:inherit;color:var(--ink);background:#fff}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px #9cc7d733}
select:disabled,input:read-only{background:var(--bg);color:var(--muted)}
.field.mandatory input,.field.mandatory select{border-left:3px solid var(--danger)}
.field.invalid input,.field.invalid select{border:1px solid var(--danger);border-left:3px solid var(--danger)}
.err{display:none;margin-top:3px;font-size:11px;color:var(--danger)}.field.invalid .err{display:block}
.banner{display:none;margin-bottom:14px;padding:9px 12px;border-radius:4px;background:#fdecea;color:var(--danger);border:1px solid #f5c6c0}
.banner.show{display:block}.footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--bg)}
button{height:34px;padding:0 20px;border-radius:4px;font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
button:hover{background:#eef1f4}button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
button.primary:hover{background:var(--brand-dark)}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(255,255,255,.88);font-weight:600}
.overlay.show{display:flex}.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
.overlay.ok{color:var(--ok)}.overlay.ok .spinner{display:none}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <div class="body"><div class="banner" id="banner"></div><form id="form" novalidate></form></div>
  <div class="footer"><button type="button" id="btnCancel">Cancel</button><button type="button" id="btnSave" class="primary">Save</button></div>
</div>
<div class="overlay" id="overlay"><div class="spinner"></div><div id="overlayText">Loading...</div></div>
<script>
(function(){
"use strict";
var DEFAULT_STATUS="Unit Confirmation";
var SECTIONS=[{title:"Project / Unit Details",items:[
 {api:"Project",label:"Project",type:"lookupDisplay",req:true,readOnly:true},
 {api:"Towers",label:"Tower",type:"lookup",module:"TOWER",req:true},
 {api:"floor_test",label:"Floor",type:"lookup",module:"FLOOR",req:true},
 {api:"Unit",label:"Unit",type:"lookup",module:"UNIT",req:true},
 {api:"Reserved_Date",label:"Reserved Date",type:"date",req:false},
 {api:"Source",label:"Source",type:"display",req:true,readOnly:true},
 {api:"Sub_Source",label:"Sub-Source",type:"display",req:true,readOnly:true}
]}];
var $=function(id){return document.getElementById(id)};
var recordId=null,targetStatus=DEFAULT_STATUS,original={},recordData={},lookupOptions={TOWER:[],FLOOR:[],UNIT:[]};
function allItems(){var a=[];SECTIONS.forEach(function(s){a=a.concat(s.items)});return a}
function showOverlay(t,ok){$("overlayText").textContent=t;$("overlay").className="overlay show"+(ok?" ok":"")}
function hideOverlay(){$("overlay").className="overlay"}
function showBanner(m){$("banner").textContent=m;$("banner").className="banner show";$("banner").scrollIntoView({block:"nearest"})}
function clearBanner(){$("banner").className="banner"}
function msg(e){return e&&e.message?e.message:JSON.stringify(e)}
function closePopup(result){try{$Client.close(result||{saved:false})}catch(e){try{ZOHO.CRM.UI.Popup.closeReload()}catch(e2){console.error(e2)}}}
function plain(v){if(v===null||v===undefined)return "";if(typeof v==="object")return v.name!==undefined?String(v.name||""):"";return String(v)}
function lookupId(v){return v&&typeof v==="object"&&v.id?String(v.id):""}
function normalizeList(response){
 // Normalize Zoho CRM function responses to a plain array of lookup records.
 var output=response;

 // Unwrap common Zoho SDK response shapes.
 for(var depth=0;depth<4;depth++){
  if(output && !Array.isArray(output) && typeof output==="object"){
   if(output.details && output.details.output!==undefined){
    output=output.details.output;
    continue;
   }
   if(output.output!==undefined){
    output=output.output;
    continue;
   }
   if(Array.isArray(output.data)){
    output=output.data;
    continue;
   }
   if(Array.isArray(output.result)){
    output=output.result;
    continue;
   }
  }

  if(typeof output==="string"){
   var str=output.trim();
   if(!str)return [];
   try{
    output=JSON.parse(str);
    continue;
   }catch(parseError){
    // Do not silently treat a Deluge list's display string as a valid list.
    console.error("getunitsbyproject returned a non-JSON string:",str);
    return [];
   }
  }
  break;
 }

 if(Array.isArray(output)){
  return output.filter(function(item){
   return item && typeof item==="object" &&
          item.id!==undefined && item.id!==null;
  });
 }

 if(output && typeof output==="object" &&
    output.id!==undefined && output.id!==null){
  return [output];
 }

 console.error("Unexpected getunitsbyproject response:",output);
 return [];
}

function fillOptions(sel,list,placeholder,keepValue){
 var old=keepValue!==undefined?String(keepValue||""):String(sel.value||"");
 var normalized=Array.isArray(list)?list:normalizeList(list);

 sel.innerHTML="";
 var first=document.createElement("option");
 first.value="";
 first.textContent=placeholder;
 sel.appendChild(first);

 normalized.forEach(function(item){
  var id=item.id!==undefined && item.id!==null?String(item.id):"";
  var name=item.Name || item.name || item.Product_Name || item.Unit_Name || id;
  if(!id)return;

  // Avoid duplicate options if the response contains duplicate records.
  if(Array.prototype.some.call(sel.options,function(option){return option.value===id;})){
   return;
  }

  var option=document.createElement("option");
  option.value=id;
  option.textContent=String(name);
  sel.appendChild(option);
 });

 // Keep the previous selection only if it is among the returned records.
 if(old && Array.prototype.some.call(sel.options,function(option){return option.value===old;})){
  sel.value=old;
 }

 console.log("Dropdown loaded:",sel.id,"options:",Math.max(0,sel.options.length-1));
}
function setLookup(sel,id,name){
 sel.innerHTML="";var first=document.createElement("option");first.value="";first.textContent="Select";sel.appendChild(first);
 if(id){var op=document.createElement("option");op.value=String(id);op.textContent=name||String(id);sel.appendChild(op);sel.value=String(id)}
}
function build(){
 var form=$("form");
 SECTIONS.forEach(function(sec){
  var fs=document.createElement("fieldset"),lg=document.createElement("legend"),grid=document.createElement("div");
  lg.textContent=sec.title;fs.appendChild(lg);grid.className="grid";fs.appendChild(grid);
  sec.items.forEach(function(it){
   var wrap=document.createElement("div");wrap.className="field"+(it.req?" mandatory":"");wrap.id="f_"+it.api;
   var label=document.createElement("label");label.htmlFor="i_"+it.api;label.textContent=it.label;
   if(it.req){var star=document.createElement("span");star.className="req";star.textContent="*";label.appendChild(star)}
   wrap.appendChild(label);
   var input;
   if(it.type==="date"){
    input=document.createElement("input");
    input.type="date";
    input.id="i_"+it.api;
   }else{
    input=document.createElement("select");
    input.id="i_"+it.api;
    if(it.type==="lookup"){fillOptions(input,[],"Select "+it.label.toLowerCase());input.disabled=true}
    else {var op=document.createElement("option");op.value="";op.textContent="";input.appendChild(op)}
   }
   if(it.readOnly){input.disabled=true;input.setAttribute("aria-readonly","true")}
   wrap.appendChild(input);var err=document.createElement("div");err.className="err";err.id="e_"+it.api;err.textContent=it.label+" cannot be empty.";wrap.appendChild(err);
   input.addEventListener("change",function(){wrap.classList.remove("invalid");if(it.type==="lookup")handleLookupChange(it.api)});
   grid.appendChild(wrap);
  });form.appendChild(fs);
 });
}


function executeGetUnits(moduleName, refIds) {
    return ZOHO.CRM.FUNCTIONS.execute("getunitsbyproject", {
        arguments: JSON.stringify({
            module: moduleName,
            RefIds: refIds
        })
    }).then(function(response) {
        console.log("Raw function response:", response);

        var output = response;

        if (output && output.details && output.details.output !== undefined) {
            output = output.details.output;
        } else if (output && output.output !== undefined) {
            output = output.output;
        }

        console.log("Deluge output:", output);
        console.log("Output type:", typeof output);

        if (typeof output === "string") {
            var text = output.trim();
            if (!text) return [];

            try {
                output = JSON.parse(text);
            } catch (parseError) {
                // Support the old output format: {"Name":"E","id":"1"},{"Name":"D","id":"2"}
                try {
                    var inner = text.replace(/^\\[|\\]$/g, "");
                    output = JSON.parse("[" + inner + "]");
                } catch (repairError) {
                    console.error("Invalid JSON returned by Deluge:", text);
                    throw new Error("The getunitsbyproject function returned invalid JSON.");
                }
            }
        }

        if (typeof output === "string") {
            try {
                output = JSON.parse(output);
            } catch (parseError) {
                console.error("Nested function output is invalid JSON:", output);
                throw new Error("Could not parse the function output.");
            }
        }

        if (!Array.isArray(output)) {
            console.error("Expected an array but received:", output);
            throw new Error("Function output is not a JSON array.");
        }

        console.log("Parsed records:", output);
        console.log("Record count:", output.length);
        return output;
    }).catch(function(error) {
        console.error("Failed to fetch records:", error);
        throw error;
    });
}


function currentRefs(){
 return {
  Project:$("i_Project").value || lookupId(recordData.Project) || "",
  Tower:$("i_Towers").value || "",
  Floor:$("i_floor_test").value || ""
 };
}

function loadLookup(moduleName, refIds) {
    return executeGetUnits(moduleName, refIds).then(function(list) {
        if (!Array.isArray(list)) {
            console.error("Expected an array but received:", list);
            throw new Error("Lookup response is not an array.");
        }

        lookupOptions[moduleName] = list;

        var api = moduleName === "TOWER"
            ? "Towers"
            : moduleName === "FLOOR"
                ? "floor_test"
                : "Unit";

        var sel = $("i_" + api);
        var current = lookupId(recordData[api]) || sel.value || "";

        // Populate without a placeholder option.
        fillOptions(sel, list, "", current);
        sel.disabled = false;

        // Preserve the existing lead lookup if it is missing from the response.
        if (current && !Array.prototype.some.call(sel.options, function(option) {
            return option.value === String(current);
        })) {
            var option = document.createElement("option");
            option.value = String(current);
            option.textContent = plain(recordData[api]) || String(current);
            sel.appendChild(option);
            sel.value = String(current);
        }

        console.log(api + " dropdown option count:", sel.options.length);
        console.log(api + " records:", list);
        return list;
    });
}


function handleLookupChange(api){
 var tower=$("i_Towers"),floor=$("i_floor_test"),unit=$("i_Unit");
 if(api==="Towers"){
  fillOptions(floor,[],"Select floor");floor.disabled=true;fillOptions(unit,[],"Select unit");unit.disabled=true;
  recordData.Towers={id:tower.value,name:tower.options[tower.selectedIndex]?tower.options[tower.selectedIndex].text:""};
  recordData.floor_test=null;recordData.Unit=null;
  if(tower.value){showOverlay("Loading floors...");loadLookup("FLOOR",currentRefs()).then(function(){hideOverlay()}).catch(function(e){hideOverlay();showBanner("Could not load floors: "+msg(e))})}
 }else if(api==="floor_test"){
  fillOptions(unit,[],"Select unit");unit.disabled=true;
  recordData.floor_test={id:floor.value,name:floor.options[floor.selectedIndex]?floor.options[floor.selectedIndex].text:""};recordData.Unit=null;
  if(floor.value){showOverlay("Loading units...");loadLookup("UNIT",currentRefs()).then(function(){hideOverlay()}).catch(function(e){hideOverlay();showBanner("Could not load units: "+msg(e))})}
 }else if(api==="Unit"){
  recordData.Unit={id:unit.value,name:unit.options[unit.selectedIndex]?unit.options[unit.selectedIndex].text:""};
 }
}
function prefill(rec){
 recordData=rec||{};original={};
 var projectId=lookupId(rec.Project),projectName=plain(rec.Project);
 setLookup($("i_Project"),projectId,projectName);
 setLookup($("i_Source"),"",plain(rec.Source)); // display-only value; never included in the update payload
 setLookup($("i_Sub_Source"),"",plain(rec.Sub_Source));
 // Read-only fields are rendered as disabled selects, so add a visible selected option.
 [["Source",rec.Source],["Sub_Source",rec.Sub_Source]].forEach(function(pair){
  var el=$("i_"+pair[0]);el.innerHTML="";var op=document.createElement("option");op.value=plain(pair[1]);op.textContent=plain(pair[1])||"—";el.appendChild(op);
 });
 allItems().forEach(function(it){original[it.api]=rec[it.api]});
 var reservedDate = rec.Reserved_Date;
 if(reservedDate){
  $("i_Reserved_Date").value = String(reservedDate).substring(0,10);
 }
 if(!projectId){return Promise.resolve()}
 $("i_Towers").disabled=true;$("i_floor_test").disabled=true;$("i_Unit").disabled=true;
 return loadLookup("TOWER",{Project:projectId,Tower:"",Floor:""}).then(function(){
  var towerId=lookupId(rec.Towers);
  if(!towerId)return;
  $("i_Towers").value=towerId;
  return loadLookup("FLOOR",{Project:projectId,Tower:towerId,Floor:""}).then(function(){
   var floorId=lookupId(rec.floor_test);if(!floorId)return;
   $("i_floor_test").value=floorId;
   return loadLookup("UNIT",{Project:projectId,Tower:towerId,Floor:floorId}).then(function(){
    var unitId=lookupId(rec.Unit);if(unitId)$("i_Unit").value=unitId;
   });
  });
 });
}
function validate(){
 var firstBad=null;
 allItems().forEach(function(it){
  var el=$("i_"+it.api),v=(el.value||"").trim(),wrap=$("f_"+it.api),err=$("e_"+it.api),bad=it.req&&!v;
  err.textContent=it.label+" cannot be empty.";wrap.classList.toggle("invalid",bad);if(bad&&!firstBad)firstBad=el;
 });
 if(firstBad){firstBad.scrollIntoView({block:"center",behavior:"smooth"});firstBad.focus();return false}return true;
}
function save(){
 clearBanner();if(!validate())return;
 showOverlay("Saving...");
 var payload={id:recordId,Lead_Status:targetStatus};
 // Lookup fields must be sent to Zoho as {id: "..."} rather than as display text.
 payload.Towers={id:$("i_Towers").value};
 payload.floor_test={id:$("i_floor_test").value};
 payload.Unit={id:$("i_Unit").value};
 var reservedDate = $("i_Reserved_Date").value;
 payload.Reserved_Date = reservedDate || null;
 // Project, Source and Sub-Source are read-only in this popup; leave them unchanged.
 ZOHO.CRM.API.updateRecord({Entity:"Leads",APIData:payload})
 .then(function(res){
  var row=res&&res.data&&res.data[0];
  if(row&&row.code==="SUCCESS"){showOverlay("Details saved",true);setTimeout(function(){closePopup({saved:true})},700)}
  else throw new Error(row?(row.message||row.code):"Unexpected response");
 }).catch(function(e){hideOverlay();showBanner("Save failed: "+msg(e))});
}
$("btnSave").addEventListener("click",save);
$("btnCancel").addEventListener("click",function(){closePopup({saved:false})});
build();
ZOHO.embeddedApp.on("PageLoad",function(data){
 data=data||{};recordId=data.recordId||(Array.isArray(data.EntityId)?data.EntityId[0]:data.EntityId);
 if(data.status)targetStatus=data.status;
 if(!recordId){showBanner("Could not identify the lead record.");return}
 showOverlay("Loading lead details...");
 ZOHO.CRM.API.getRecord({Entity:"Leads",RecordID:recordId})
 .then(function(resp){var rec=resp&&resp.data&&resp.data[0];if(!rec)throw new Error("Lead record not found");return prefill(rec)})
 .then(hideOverlay).catch(function(e){hideOverlay();showBanner("Could not load lead details: "+msg(e))});
});
ZOHO.embeddedApp.init();
})();
</script>
</body>
</html>
